name: Project verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify.mjs
      - name: Verification summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .verification/summary-all.json) {
            Get-Content .verification/summary-all.json -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
          }
